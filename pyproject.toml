[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexscope"
version = "1.0.0"
description = "Scoped, one-shot, revocable agent credentials — Python SDK, CLI, and offline audit verifier"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
lexscope-py = "lexscope.cli:main_entry"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
